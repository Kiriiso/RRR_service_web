<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <style>
    #pantalla-carga {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0d14;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #pantalla-carga.oculta {
        opacity: 0;
        visibility: hidden;
    }

    #pantalla-carga img {
        width: 128px;
        border-radius: 50%;
        animation: rebote 1s infinite;
    }

    @media (min-width: 768px) {
        #pantalla-carga img {
            width: 192px;
        }
    }

    @keyframes rebote {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    /* Borde RGB animado */
    @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
    }

    @keyframes girar-borde {
        to {
            --angle: 360deg;
        }
    }

    .rgb-border {
        padding: 4px;
        border-radius: 12px;
        background: conic-gradient(
            from var(--angle),
            #ff0000, #00ff00, #0000ff, #ff0000
        );
        animation: girar-borde 4s linear infinite;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5), 0 0 30px rgba(0, 255, 0, 0.3), 0 0 45px rgba(0, 0, 255, 0.3);
    }

    .rgb-border > * {
        background: #0a0d14;
        border-radius: 10px;
    }
    </style>
</head>

<body>
    <div id="pantalla-carga">
        <img src="img/logorrr.jpeg" alt="Cargando...">

    </div>

    <div class="rgb-border">

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <img src="img/logorrr.jpeg" alt="Logo RRR Servicio Técnico">
                <span class="gradient-text">Servicio Técnico RRR</span>
            </a>
            <nav>
                <ul class="nav-main">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Accesorios</a></li>
                    <li><a href="index.html#servicios">Servicios</a></li>
                    <li><a href="index.html#contacto">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <header class="section-header">
                    <h2 class="gradient-text">Accesorios</h2>
                    <p>Encuentra los mejores accesorios para tus dispositivos</p>
                </header>

                <div class="swiper">
                    <div class="swiper-wrapper" id="catalogo">
                    </div>

                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="copy">&copy; 2026 Servicio Técnico RRR. Todos los derechos reservados.</p>
        </div>
    </footer>
    </div>
    <!-- Script al final, después de cargar Swiper -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    fetch('data/productos.json')
        .then(res => res.json())
        .then(productos => {
            const catalogo = document.getElementById('catalogo');

            productos.forEach(p => {
                const slide = document.createElement('a');
                slide.href = `producto.html?id=${p.id}`;
                slide.className = 'accesorio-card swiper-slide';
                slide.innerHTML = `
                    <img src="${p.imagenes[0]}" alt="${p.nombre}">
                    <span class="producto-categoria">${p.categoria}</span>
                    <h3>${p.nombre}</h3>
                    <p class="producto-precio">${p.precio}</p>
                    <p>${p.descripcion}</p>
                `;
                catalogo.appendChild(slide);
            });

            new Swiper('.swiper', {
                slidesPerView: 1,
                spaceBetween: 24,
                loop: true,
                breakpoints: {
                    700: { slidesPerView: 2 },
                    1024: { slidesPerView: 3 }
                },
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev',
                },
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
            });
        })
        .catch(() => {
            document.getElementById('catalogo').innerHTML =
                '<p style="color:var(--texto-suave)">Error al cargar los productos.</p>';
        });
</script>
<script src="js/main.js"></script>
    <script>
        window.addEventListener('load', () => {
            const pantalla = document.getElementById('pantalla-carga');
            pantalla.classList.add('oculta');
            setTimeout(() => pantalla.remove(), 500);
        });

        // Respaldo: oculta la pantalla de carga aunque algún recurso tarde demasiado
        setTimeout(() => {
            const pantalla = document.getElementById('pantalla-carga');
            if (pantalla) pantalla.classList.add('oculta');
        }, 5000);
    </script>
</body>
</html>
